[project]
name = "diabetes-risk-prediction"
version = "1.0.0"
description = "An Explainable Machine Learning Application for Diabetes Risk Assessment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.3",
    "numpy>=1.26.4",
    "scikit-learn>=1.5.2",
    "streamlit>=1.40.1",
    "plotly>=5.24.1",
    "matplotlib>=3.9.2",
    "seaborn>=0.13.2",
    "joblib>=1.4.2",
    "pydantic>=2.9.2",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
